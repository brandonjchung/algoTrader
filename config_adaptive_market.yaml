# Adaptive Market Strategy Configuration
# Optimized for Dec 2024 - Feb 2026 market conditions based on REAL data analysis

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0  # Tighter than default
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60  # Avoid first hour
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "adaptive_market"

  # Mean Reversion Parameters (for ranging markets - 73.8% of time)
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std: 2.0

  # Breakout Parameters (for trending markets - 26.2% of time)
  breakout_lookback: 20
  breakout_strength: 0.2  # ATR multiple
  volume_threshold: 1.2

  # Regime Detection
  adx_period: 14
  trending_threshold: 20  # ADX > 20 = trending, < 20 = ranging

  # Risk Management (WIDER stops for ranging market)
  atr_period: 14
  stop_loss_atr_multiple: 3.0  # Increased from 2.5 (survive chop)
  take_profit_atr_multiple: 3.5  # Adjusted

  # Circuit Breaker
  max_consecutive_losses: 5
  max_daily_loss_pct: 2.0  # Stop trading if lose 2% in one day
  max_trades_per_day: 3  # Limit trades to avoid overtrading

  # TIME FILTERS (CRITICAL - based on market analysis)
  # Best hours: 13:00 (+0.0164%), 16:00 (+0.0028%), 21:00 (+0.0032%)
  # Worst hours: 14:00 (-0.0032%), 17:00 (-0.0034%), 19:00 (-0.0009%)
  allowed_hours: [13, 16, 21]  # ONLY trade these hours
  avoid_hours: [14, 17, 19]    # NEVER trade these hours

  # Trade Management
  max_bars_in_trade: 60
  min_bars_between_trades: 5

data:
  source: "ib_real_data"
  timeframe: "5min"
  start_date: "2024-12-20"
  end_date: "2026-02-13"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/adaptive_market.log"
