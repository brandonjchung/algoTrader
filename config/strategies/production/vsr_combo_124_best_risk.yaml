# Volume Spike Reversal - Combo #124 (Best Risk-Adjusted)
# 11.55% return, 52.27% WR, PF 3.77, MaxDD -0.71%, 44 trades
# Tightest stop (1.0 ATR) with wide target (3.5 ATR)
# Lower WR but highest PF due to excellent risk:reward ratio

strategy:
  name: "volume_spike_reversal"
  volume_spike_threshold: 4.0
  volume_lookback: 20
  bb_period: 20
  bb_std_mult: 2.0
  atr_period: 14
  stop_loss_atr_multiple: 1.0
  take_profit_atr_multiple: 3.5
  max_bars_in_trade: 60
  max_trades_per_day: 1
  max_consecutive_losses: 4
  allowed_hours: [13, 14, 15, 16, 17, 18, 19, 20, 21]
  use_volatility_filter: true
  max_atr_for_entry: 8.0
  min_atr_for_entry: 1.0

logging:
  log_file: "logs/vsr_combo_124.log"
