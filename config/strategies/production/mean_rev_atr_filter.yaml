# V1 + ATR Filter ONLY
# SINGLE CHANGE from V1 baseline: Added volatility filter
#
# Hypothesis: Mean reversion fails in high volatility (ATR > 5.0)
# Evidence: "Very High" ATR quintile lost -$873 (all net losses)
#           After-peak ATR avg was 6.25 vs before-peak 3.59
# Economic rationale: Mean reversion assumes prices return to mean.
#           In high-vol environments, trends dominate and MR signals fail.
#
# CHANGE LOG (vs config_adaptive_market.yaml):
#   ADDED: use_volatility_filter: true
#   ADDED: max_atr_for_entry: 5.0
#   ADDED: min_atr_for_entry: 1.5
#   NOTHING ELSE CHANGED

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "adaptive_market"

  # === ALL V1 PARAMETERS (UNCHANGED) ===
  rsi_period: 14
  rsi_oversold: 35
  rsi_overbought: 65
  bb_period: 20
  bb_std: 2.0

  breakout_lookback: 20
  breakout_strength: 0.2
  volume_threshold: 1.2

  adx_period: 14
  trending_threshold: 20

  atr_period: 14
  stop_loss_atr_multiple: 3.0
  take_profit_atr_multiple: 3.5

  max_consecutive_losses: 5
  max_daily_loss_pct: 2.0
  max_trades_per_day: 3

  allowed_hours: [13, 14, 15, 16, 17, 18, 19, 20, 21]
  avoid_hours: []

  max_bars_in_trade: 60
  min_bars_between_trades: 5

  # === SINGLE CHANGE: VOLATILITY FILTER ===
  # Don't trade when ATR is too high (mean reversion fails)
  # or too low (not enough movement to profit after costs)
  use_volatility_filter: true
  max_atr_for_entry: 5.0   # Regime data: Very High ATR lost -$873
  min_atr_for_entry: 1.5   # Too low = can't cover commissions

  # === V2/V3 FEATURES DISABLED ===
  short_require_strong_signal: false
  short_min_bb_distance: 0.0
  use_trailing_stop: false
  use_adaptive_regime: false
  track_recent_performance: false

data:
  source: "ib_real_data"
  timeframe: "5min"
  start_date: "2024-12-20"
  end_date: "2026-02-13"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/adaptive_market_atr_filter.log"
