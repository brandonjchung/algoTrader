# Volume Spike Reversal - Combo #100
# 10.39% return, 51.43% WR, PF 3.82, MaxDD -0.86%, 35 trades
# Lower volume threshold (3.5x) with wider BB (2.5 std)
# Fewer trades but highest PF of all combos

strategy:
  name: "volume_spike_reversal"
  volume_spike_threshold: 3.5
  volume_lookback: 20
  bb_period: 20
  bb_std_mult: 2.5
  atr_period: 14
  stop_loss_atr_multiple: 1.0
  take_profit_atr_multiple: 3.5
  max_bars_in_trade: 60
  max_trades_per_day: 1
  max_consecutive_losses: 4
  allowed_hours: [13, 14, 15, 16, 17, 18, 19, 20, 21]
  use_volatility_filter: true
  max_atr_for_entry: 8.0
  min_atr_for_entry: 1.0

logging:
  log_file: "logs/vsr_combo_100.log"
