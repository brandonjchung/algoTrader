# Adaptive Market Strategy V3 - TRULY ADAPTIVE
# V2 failed because we were too restrictive. V3 focuses on ADAPTATION.
#
# V2 Failures:
# - Wider stops (4.0 ATR) made losses 48% worse
# - Stricter RSI (30/70) blocked 62% of trades including good ones
# - SHORT filter blocked 93% of SHORTs, lost $500+ in P&L
# - Trailing stops cut winners too early
#
# V3 Solution: Revert restrictive changes, add TRUE adaptivity

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "adaptive_market"

  # Mean Reversion Parameters - REVERTED to V1 (worked better)
  rsi_period: 14
  rsi_oversold: 35  # ✅ Back to 35 (30 was too strict)
  rsi_overbought: 65  # ✅ Back to 65 (70 was too strict)
  bb_period: 20
  bb_std: 2.0

  # Risk Management - REVERTED to V1 (narrower stops were better!)
  atr_period: 14
  stop_loss_atr_multiple: 3.0  # ✅ Back to 3.0 (4.0 made losses 48% worse!)
  take_profit_atr_multiple: 3.5

  # Circuit Breaker
  max_consecutive_losses: 5
  max_daily_loss_pct: 2.0
  max_trades_per_day: 3  # ✅ Back to 3 (2 was too restrictive)

  # TIME FILTERS (Keep - this worked in V1)
  allowed_hours: [13, 16, 21]  # Best hours from analysis
  avoid_hours: [14, 17, 19]    # Worst hours

  # Trade Management
  max_bars_in_trade: 60
  min_bars_between_trades: 5

  # V3 - REMOVE overly strict SHORT filters (they blocked 93% of trades)
  short_require_strong_signal: false  # ✅ Disabled - was too strict
  short_min_bb_distance: 0.0          # ✅ Disabled

  # V3 - DISABLE trailing stops (they cut winners too early)
  use_trailing_stop: false  # ✅ Disabled - was reducing avg win size

  # V3 - NEW: Volatility-based position sizing
  use_volatility_filter: true
  max_atr_for_entry: 8.0     # Don't enter if ATR > 8.0 (too choppy)
  min_atr_for_entry: 2.0     # Don't enter if ATR < 2.0 (too dead)

  # V3 - NEW: Adaptive regime detection (the REAL improvement)
  use_adaptive_regime: true
  regime_lookback: 100        # Look back 100 bars to detect regime
  trending_threshold: 25      # ADX > 25 = trending
  ranging_threshold: 20       # ADX < 20 = ranging

  # V3 - NEW: Win rate tracking for adaptation
  track_recent_performance: true
  recent_trades_window: 10    # Track last 10 trades
  pause_if_win_rate_below: 0.30  # Stop trading if WR < 30% in last 10

data:
  source: "ib_real_data"
  timeframe: "5min"
  start_date: "2024-12-20"
  end_date: "2026-02-13"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/adaptive_market_v3.log"
