# COMPONENT TEST: V1+ATR with RSI 40/60 (looser)
#
# Hypothesis: Looser RSI thresholds capture more opportunities
# Test: Change RSI from 35/65 to 40/60, keep everything else same
# If performance improves -> more trades = more edge captured
# If performance drops -> looser thresholds = too many bad entries
#
# CHANGE vs v1_atr_filter.yaml:
#   CHANGED: rsi_oversold 35 -> 40
#   CHANGED: rsi_overbought 65 -> 60
#   NOTHING ELSE CHANGED

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "adaptive_market"

  rsi_period: 14
  rsi_oversold: 40   # CHANGED from 35 (looser)
  rsi_overbought: 60  # CHANGED from 65 (looser)
  bb_period: 20
  bb_std: 2.0

  breakout_lookback: 20
  breakout_strength: 0.2
  volume_threshold: 1.2

  adx_period: 14
  trending_threshold: 20

  atr_period: 14
  stop_loss_atr_multiple: 3.0
  take_profit_atr_multiple: 3.5

  max_consecutive_losses: 5
  max_daily_loss_pct: 2.0
  max_trades_per_day: 3

  allowed_hours: [13, 16, 21]
  avoid_hours: [14, 17, 19]

  max_bars_in_trade: 60
  min_bars_between_trades: 5

  use_volatility_filter: true
  max_atr_for_entry: 5.0
  min_atr_for_entry: 1.5

  short_require_strong_signal: false
  short_min_bb_distance: 0.0
  use_trailing_stop: false
  use_adaptive_regime: false
  track_recent_performance: false

data:
  source: "ib_real_data"
  timeframe: "5min"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/test_rsi_40_60.log"
