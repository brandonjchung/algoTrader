# STRATEGY: Trend Following - Breakout (MES/ES 5-min)
# =================================================
# DEVELOPMENT - Initial baseline, untested
#
# Core Idea: Trade breakouts of N-bar highs/lows with trend confirmation.
# Designed as COMPLEMENT to mean_rev_quiet_filter:
#   Mean rev works: ATR 1.5-5.0, low volume, ranging (quiet hours)
#   This targets:   ATR > 3.0, high volume, trending (active hours)
#
# Entry: Close breaks above N-bar high (or below N-bar low)
# Confirmation: ADX > 20 (trending), volume > 1.2x average, DI direction
# Exit: Trailing ATR stop (let winners run), fixed TP at 4 ATR, time exit
#
# STATUS: DEVELOPMENT - needs initial backtest and calibration

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "trend_following"

  # Breakout parameters
  breakout_period: 20
  breakout_atr_buffer: 0.25

  # Momentum confirmation
  adx_period: 14
  adx_min_threshold: 20

  # Volume confirmation (opposite of MR - want high volume)
  min_volume_ratio: 1.2

  # ATR filter (require volatility)
  atr_period: 14
  min_atr_for_entry: 3.0
  max_atr_for_entry: 12.0

  # Risk management
  stop_loss_atr_multiple: 2.0
  take_profit_atr_multiple: 4.0
  use_trailing_stop: true
  trailing_stop_atr: 2.0

  # Time filters - active market hours
  allowed_hours: [14, 15, 16, 17, 18, 19, 20]
  avoid_hours: []

  # Trade management
  max_trades_per_day: 2
  max_consecutive_losses: 4
  max_bars_in_trade: 48

data:
  source: "historical"
  timeframe: "5min"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/trend_following_v1.log"
