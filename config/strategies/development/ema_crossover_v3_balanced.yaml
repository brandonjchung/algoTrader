# STRATEGY: EMA 9 Crossover - Balanced (MES/ES 5-min)
# ====================================================
# DEVELOPMENT - V3: Balanced approach
#
# V2 was close to breakeven (PF 0.99, WR 28.7%, R/R 2.47:1)
# Peaked at +37% then regime shifted.
#
# Changes from V2:
#   - Remove ADX filter (EMA cross IS the trend signal - ADX is redundant)
#   - Slightly looser stop (1.8 ATR) to avoid noise stopouts
#   - Keep strong distance filter and volume requirement
#   - Add morning-only hours (9-12) when trends are strongest
#
# STATUS: DEVELOPMENT - testing balanced parameters

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "ema_crossover"

  # EMA parameters
  ema_period: 9

  # Strong crosses only
  min_cross_distance_pct: 0.20

  # Volume filter
  min_volume_ratio: 1.2
  volume_ma_period: 20

  # ATR filter
  atr_period: 14
  min_atr_for_entry: 10.0
  max_atr_for_entry: 24.0

  # ADX off - EMA cross is the trend signal
  use_adx_filter: false
  adx_period: 14
  adx_min_threshold: 20

  # Risk management - wider stop, big target
  stop_loss_atr_multiple: 1.8
  take_profit_atr_multiple: 4.0

  # Morning hours only (strongest intraday trends)
  allowed_hours: [10, 11, 12, 13]
  avoid_hours: []

  # Trade management
  max_trades_per_day: 2
  max_consecutive_losses: 5
  max_bars_in_trade: 48

data:
  source: "historical"
  timeframe: "5min"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/ema_crossover_v3_balanced.log"
