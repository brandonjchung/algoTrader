# TF Upgrade 3: Pullback entry after breakout
# ==============================================
# Hypothesis: Entering AT the breakout is the worst price (chasing).
# Better to wait for a pullback to the breakout level, then enter when
# price resumes in the breakout direction. Confirms level holds as S/R.
# Change: use_pullback_entry: true (ONLY change from v1)

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "trend_following"

  breakout_period: 20
  breakout_atr_buffer: 0.25

  # CHANGED: pullback entry mode
  use_pullback_entry: true
  pullback_lookback: 6
  pullback_pct: 0.3

  adx_period: 14
  adx_min_threshold: 20
  min_volume_ratio: 1.2
  atr_period: 14
  min_atr_for_entry: 3.0
  max_atr_for_entry: 12.0
  stop_loss_atr_multiple: 2.0
  take_profit_atr_multiple: 4.0
  use_trailing_stop: true
  trailing_stop_atr: 2.0
  allowed_hours: [14, 15, 16, 17, 18, 19, 20]
  avoid_hours: []
  max_trades_per_day: 2
  max_consecutive_losses: 4
  max_bars_in_trade: 48

data:
  source: "historical"
  timeframe: "5min"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/tf_test_pullback.log"
