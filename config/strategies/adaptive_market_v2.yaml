# Adaptive Market Strategy V2 - IMPROVED
# Fixes identified issues from v1 analysis:
# - Wider stops (4.0 ATR) to survive whipsaw
# - Stricter RSI (30/70) for quality over quantity
# - Better SHORT filters
# - Profit protection
# - Reduced overtrading (2/day vs 3)

trading:
  symbol: "MES"
  initial_capital: 10000
  position_size: 1
  max_positions: 1

contract:
  tick_size: 0.25
  tick_value: 1.25
  point_value: 5.0
  margin_requirement: 1200

costs:
  commission_per_side: 0.60
  slippage_ticks: 1

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 2.0
  max_drawdown_pct: 15.0
  risk_free_rate: 0.05

time_filters:
  trade_only_rth: true
  avoid_first_minutes: 60
  avoid_last_minutes: 15
  no_overnight: true

strategy:
  name: "adaptive_market"

  # Mean Reversion Parameters - STRICTER for quality
  rsi_period: 14
  rsi_oversold: 30  # ✅ Tightened from 35 (more extreme = better quality)
  rsi_overbought: 70  # ✅ Tightened from 65 (more extreme = better quality)
  bb_period: 20
  bb_std: 2.0

  # Risk Management - WIDER stops to survive whipsaw
  atr_period: 14
  stop_loss_atr_multiple: 4.0  # ✅ Increased from 3.0 (avg loss -$89, need more room)
  take_profit_atr_multiple: 4.5  # ✅ Proportionally increased

  # Circuit Breaker
  max_consecutive_losses: 5
  max_daily_loss_pct: 2.0
  max_trades_per_day: 2  # ✅ Reduced from 3 (avoid overtrading)

  # TIME FILTERS (CRITICAL - based on market analysis)
  allowed_hours: [13, 16, 21]  # Best hours only
  avoid_hours: [14, 17, 19]    # Worst hours

  # Trade Management
  max_bars_in_trade: 60
  min_bars_between_trades: 5

  # SHORT TRADE FILTERS (V2 - address 38% win rate issue)
  short_require_strong_signal: true  # Only SHORT when VERY overbought
  short_min_bb_distance: 0.5  # Price must be 0.5% above BB upper for SHORT

  # PROFIT PROTECTION (V2 - lock in gains)
  use_trailing_stop: true
  trailing_stop_activation_atr: 2.0  # Activate trailing after 2 ATR profit
  trailing_stop_distance_atr: 2.5    # Trail 2.5 ATR below high (LONG) or above low (SHORT)

data:
  source: "ib_real_data"
  timeframe: "5min"
  start_date: "2024-12-20"
  end_date: "2026-02-13"

backtest:
  walk_forward: false
  save_trades: true
  save_equity_curve: true
  generate_report: true

logging:
  level: "INFO"
  log_to_file: true
  log_file: "logs/adaptive_market_v2.log"
